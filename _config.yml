# GitHub Pages / Jekyll config for the AI-DLC Adoption Bootcamp site.
# Theme: just-the-docs (sidebar nav + search), pinned to a version that builds
# on GitHub Pages' classic branch build (Jekyll 3.9).

title: AI-DLC Adoption Bootcamp
description: >-
  Get your product team productive on AWS AI-DLC (v2) — a role-based,
  hands-on bootcamp for Developers, Product Managers, and UX Designers.

remote_theme: just-the-docs/just-the-docs@v0.3.3

# Project site at https://tyoung-sc.github.io/aidlc-training/ — baseurl is the repo
# path so theme CSS/assets resolve. Change to "" only for a custom domain.
baseurl: "/aidlc-training"
url: "https://tyoung-sc.github.io"

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter

relative_links:
  enabled: true
  collections: true

# Render Markdown (tables/lists) inside our <details> toggles.
kramdown:
  parse_block_html: true

# just-the-docs options
search_enabled: true
heading_anchors: true
color_scheme: light
nav_sort: case_insensitive

# Keep build/infra files out of the published site.
exclude:
  - PUBLISHING.md
  - references/
  - "*.pdf"
  - Gemfile
  - Gemfile.lock
  - vendor/
